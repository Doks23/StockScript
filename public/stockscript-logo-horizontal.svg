<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <title>StockScript Journal — horizontal lockup</title>
  <desc>Nav bar horizontal lockup with icon mark and wordmark</desc>

  <!-- Icon mark, centred at (40, 40) -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#1a4731" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="29" fill="#1a4731"/>

  <polyline
    points="18,52 26,52 26,43 33,43 33,33 42,33 52,24"
    fill="none" stroke="#6dc99a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline
    points="46,20 52,24 47,30"
    fill="none" stroke="#6dc99a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="18,58 24,52 18,46" fill="#c4922a"/>
  <line x1="18" y1="58" x2="21" y2="52" stroke="#1a4731" stroke-width="1"/>

  <!-- Vertical divider -->
  <line x1="84" y1="18" x2="84" y2="62" stroke="#c8c0b0" stroke-width="0.75"/>

  <!-- Wordmark -->
  <text x="96" y="35"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="20"
    letter-spacing="-0.5"
    fill="#1a2e1e">Stock</text>
  <text x="96" y="58"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="20"
    letter-spacing="-0.5"
    fill="#2a6b4a">Script</text>

  <!-- Sub label -->
  <text x="178" y="35"
    font-family="Arial, sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#1a2e1e"> Journal</text>

  <!-- Tagline -->
  <text x="98" y="70"
    font-family="Arial, sans-serif"
    font-size="7.5"
    font-weight="600"
    letter-spacing="2.5"
    fill="#7a9278">TRADE · REFLECT · IMPROVE</text>
</svg>
